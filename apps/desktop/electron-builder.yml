appId: com.mccode.editor
productName: MCCode
copyright: Copyright © 2026 MCCode
publish: null
directories:
  output: release
  buildResources: apps/desktop/build
files:
  - apps/desktop/main.cjs
  - apps/desktop/preload.cjs
  - package.json
extraResources:
  - from: apps/web/dist
    to: web/dist
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
