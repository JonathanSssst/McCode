name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build web
        run: npm run build
      - name: Package Windows installer
        run: npx electron-builder --config apps/desktop/electron-builder.yml --win --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mccode-windows-installer
          path: release/*.exe
